 ['nt','no','np','coord','phrase','explanation'].forEach(id=>el(id).style.transition='none');
 idx=j;layer=0;draw();
 void el('stage').offsetWidth;
 requestAnimationFrame(()=>['nt','no','np','coord','phrase','explanation'].forEach(id=>el(id).style.transition=''));
}
function pickRandom(){let j;do{j=Math.floor(Math.random()*54)}while(j===idx);return j}
function move(n){if(randomMode&&n>0){resetTo(pickRandom());return}if(randomMode&&n<0)return;resetTo(idx+n)}
function reveal(){if(layer<6){layer++;draw()}else if(randomMode||idx<53)move(1)}
el('jump').addEventListener('change',e=>resetTo(Number(e.target.value)));
el('random').addEventListener('click',()=>{
 randomMode=!randomMode;el('random').setAttribute('aria-pressed',String(randomMode));
 el('random').textContent='Random mode: '+(randomMode?'On':'Off');
 if(randomMode)resetTo(pickRandom());else resetTo(0);
});
el('reveal').onclick=reveal;el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);
let x0=null,swiped=false;
el('stage').addEventListener('pointerdown',e=>{x0=[e.clientX,e.clientY];swiped=false});
el('stage').addEventListener('pointerup',e=>{if(!x0)return;let dx=e.clientX-x0[0],dy=e.clientY-x0[1];if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2){swiped=true;move(dx<0?1:-1)}x0=null});
el('stage').addEventListener('click',()=>{if(swiped){swiped=false;return}reveal()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();reveal()}});
draw();
</script></body></html>
