<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142535"><title>Reading Room · Fiche Ceathar</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101c29;color:#eee9dc;font:16px/1.75 system-ui,-apple-system,Segoe UI,sans-serif}a{color:#b3e0d4}header{max-width:920px;margin:auto;padding:20px 18px;border-bottom:1px solid #475664;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}header a{font-size:.9rem}.brand{font:1.25rem Georgia,serif;color:#edcb8b;text-decoration:none}.wrap{max-width:920px;margin:0 auto;padding:35px 18px 100px}.eyebrow{color:#edcb8b;letter-spacing:.15em;text-transform:uppercase;font-size:.72rem;font-weight:750}h1,h2,h3,h4{font-family:Georgia,serif;font-weight:normal;line-height:1.2;scroll-margin-top:25px}h1{font-size:clamp(2.7rem,7vw,4.5rem);color:#edcb8b;margin:.6em 0}h2{font-size:2.2rem;margin-top:2em;border-bottom:1px solid #4c5963;padding-bottom:.2em}h3{font-size:1.55rem;margin-top:1.8em}p,li{line-height:1.8}blockquote{border-left:3px solid #d4b775;margin:22px 0;padding:6px 22px;color:#d9e2dd;background:#1a2b38}pre{overflow:auto;background:#1b2b3b;border:1px solid #455764;border-radius:10px;padding:18px;white-space:pre}code{background:#293b49;border-radius:4px;padding:2px 5px;font-size:.88em}pre code{background:none;padding:0}table{border-collapse:collapse;min-width:700px;width:100%;font-size:.87rem}th,td{padding:10px 13px;text-align:left;border:1px solid #4b5a65;vertical-align:top}th{background:#304252;color:#f0d6a3}.tablewrap{overflow-x:auto;margin:22px 0;border-radius:10px}hr{border:0;border-top:1px solid #4b5a65;margin:35px 0}.status{color:#b5c6c6}.source{font-size:.82rem;color:#b5c6c6;margin:8px 0 30px;overflow-wrap:anywhere}a:focus-visible{outline:2px solid #edcb8b;outline-offset:3px}ul,ol{padding-left:1.6em}img{max-width:100%}@media(max-width:550px){.wrap{padding-top:23px}h2{font-size:1.75rem}.tablewrap{margin-left:-12px;margin-right:-12px}}</style></head><body><header><a class="brand" href="./index.html">Fiche Ceathar / Reading Room</a><nav><a href="./handbook.html">First Handbook</a> · <a href="./index.html">Home</a></nav></header><main class="wrap"><div class="eyebrow">A readable edition of the source document</div><div class="source" id="source"></div><article id="document" aria-live="polite"><p class="status">Opening the text…</p></article></main><script>
const root=document.getElementById('document'),source=document.getElementById('source'),params=new URLSearchParams(location.search),path=params.get('doc')||'';
const allowed=/^(?:[a-zA-Z0-9_. -]+\/)*[a-zA-Z0-9_. -]+\.md$/;
function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hrefFor(url){if(/^(https?:|mailto:|#)/i.test(url))return url;const parts=url.split('#'),name=parts[0];if(!name)return url;if(/\.md$/i.test(name)){const absolute=new URL(name,new URL(path,location.href));const base=new URL('./',location.href);if(absolute.origin===base.origin&&absolute.pathname.startsWith(base.pathname)){const rel=decodeURIComponent(absolute.pathname.slice(base.pathname.length));return './markdown-reader.html?doc='+encodeURIComponent(rel)+(parts[1]?'#'+encodeURIComponent(parts[1]):'')}}return url}
function inline(s){let t=escapeHTML(s);const codes=[];t=t.replace(/`([^`]+)`/g,(_,v)=>{codes.push('<code>'+v+'</code>');return '@@CODE'+(codes.length-1)+'@@'});t=t.replace(/!\[([^\]]*)\]\(([^\s)]+)\)/g,(_,label,url)=>'<img alt="'+label+'" src="'+escapeHTML(url)+'">');t=t.replace(/\[([^\]]+)\]\(([^\s)]+)(?:\s+&quot;[^&]*&quot;)?\)/g,(_,label,url)=>'<a href="'+escapeHTML(hrefFor(url))+'">'+label+'</a>');t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/~~([^~]+)~~/g,'<del>$1</del>');t=t.replace(/@@CODE(\d+)@@/g,(_,i)=>codes[+i]);return t}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-')}
function parse(md){const lines=md.replace(/\r\n/g,'\n').split('\n');let out=[],i=0,list=null;const close=()=>{if(list){out.push('</'+list+'>');list=null}};const special=s=>/^\s*(?:#{1,6}\s|[-*+]\s|\d+\.\s|>|\`\`\`|~~~|---+\s*$|\|)/.test(s);while(i<lines.length){let line=lines[i];if(!line.trim()){close();i++;continue}const fence=line.match(/^\s*(```|~~~)/);if(fence){close();let code=[];i++;while(i<lines.length&&!lines[i].trim().startsWith(fence[1]))code.push(lines[i++]);i++;out.push('<pre><code>'+escapeHTML(code.join('\n'))+'</code></pre>');continue}const heading=line.match(/^(#{1,6})\s+(.+)$/);if(heading){close();const level=heading[1].length,id=slug(heading[2]);out.push('<h'+level+' id="'+id+'">'+inline(heading[2])+'</h'+level+'>');i++;continue}if(/^\s*\|/.test(line)&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){close();const split=s=>s.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(x=>x.trim());const cells=split(line);out.push('<div class="tablewrap"><table><thead><tr>'+cells.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>');i+=2;while(i<lines.length&&/^\s*\|/.test(lines[i])){out.push('<tr>'+split(lines[i]).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>');i++}out.push('</tbody></table></div>');continue}if(/^\s*---+\s*$/.test(line)){close();out.push('<hr>');i++;continue}if(/^\s*>/.test(line)){close();let q=[];while(i<lines.length&&/^\s*>/.test(lines[i]))q.push(lines[i++].replace(/^\s*>\s?/,''));out.push('<blockquote>'+q.map(x=>'<p>'+inline(x)+'</p>').join('')+'</blockquote>');continue}const bullet=line.match(/^\s*([-*+]|\d+\.)\s+(.+)$/);if(bullet){const type=/\d/.test(bullet[1])?'ol':'ul';if(list!==type){close();out.push('<'+type+'>');list=type}out.push('<li>'+inline(bullet[2])+'</li>');i++;continue}close();let paragraph=[line];i++;while(i<lines.length&&lines[i].trim()&&!special(lines[i]))paragraph.push(lines[i++]);out.push('<p>'+inline(paragraph.join(' '))+'</p>')}close();return out.join('\n')}
if(!allowed.test(path)||path.includes('..')){root.innerHTML='<p>Choose a document from the <a href="./index.html">Fiche Ceathar homepage</a>.</p>'}else{source.textContent='Source: '+path;fetch('./'+path).then(r=>{if(!r.ok)throw Error('The source document is not available ('+r.status+').');return r.text()}).then(t=>{root.innerHTML=parse(t);document.title=(root.querySelector('h1')?.textContent||path)+' · Fiche Ceathar';if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));target?.scrollIntoView()}}).catch(e=>{root.textContent=e.message})}
</script></body></html>
