<!doctype html>
<html lang="en">
<head><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./app-icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="The 54">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The One Atlas — The 54</title>
<meta name="description" content="The complete One Atlas of Completed Intelligibility in a readable HTML edition.">
<style>
:root{color-scheme:dark;--bg:#10151e;--paper:#182432;--ink:#f1f0e9;--muted:#b7c6d4;--gold:#edcf83;--mint:#83ded0;--edge:#35465b}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:85px}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.75 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--mint)}a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.top{position:sticky;top:0;z-index:10;background:#111b28f5;border-bottom:1px solid var(--edge);backdrop-filter:blur(8px)}
.top-inner{max-width:1400px;margin:auto;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font:normal 1.25rem Georgia,serif;color:var(--gold);text-decoration:none}
.tools{display:flex;gap:8px;align-items:center}
.tools a,.tools button{border:1px solid var(--edge);background:#233347;border-radius:30px;color:var(--ink);padding:6px 12px;text-decoration:none;font:600 .82rem system-ui;cursor:pointer}
.tools a:hover,.tools button:hover{border-color:var(--gold)}
.layout{display:grid;grid-template-columns:minmax(205px,265px) minmax(0,850px);gap:clamp(20px,4vw,65px);max-width:1270px;padding:34px 20px 100px;margin:auto}
aside{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow-y:auto;background:var(--paper);border:1px solid var(--edge);border-radius:14px;padding:19px 15px}
aside h2{font:700 .75rem system-ui;color:var(--gold);text-transform:uppercase;letter-spacing:.13em;margin:0 0 12px}
aside nav a{display:block;color:var(--muted);text-decoration:none;font:.85rem/1.4 system-ui;padding:7px 8px;border-radius:6px}
aside nav a.cell{padding-left:21px}
aside nav a:hover{color:var(--ink);background:#2b3c50}
main{min-width:0}#status{background:var(--paper);border:1px solid var(--edge);border-radius:12px;padding:17px}
#content{font:normal 1.13em/1.83 Georgia,'Times New Roman',serif;overflow-wrap:anywhere}
#content h1,#content h2,#content h3,#content h4{font-weight:normal;line-height:1.22;scroll-margin-top:88px}
#content h1{font-size:clamp(2rem,4.3vw,3.35rem);color:var(--gold);margin:0 0 30px}
#content h2{font-size:clamp(1.7rem,3.2vw,2.35rem);color:var(--gold);border-top:1px solid var(--edge);padding-top:25px;margin:64px 0 18px}
#content h3{font-size:clamp(1.4rem,2.65vw,1.85rem);color:var(--mint);margin:43px 0 16px}
#content h4{font-size:1.24rem;color:#eee0b9;margin:30px 0 12px}
#content p,#content ul,#content ol{margin:0 0 1.2em}#content li{margin-bottom:.35em}
#content blockquote{background:#1b2b39;border-left:3px solid var(--gold);padding:10px 22px;margin:24px 0}
#content hr{border:0;border-top:1px solid var(--edge);margin:38px 0}
#content strong{color:#fff8e4}
#content pre{background:#0c141f;border:1px solid var(--edge);border-radius:10px;padding:16px;overflow:auto;font:.83rem/1.5 ui-monospace,monospace}
#content :not(pre)>code{background:#26384a;padding:2px 5px;border-radius:5px;font-size:.9em}
.table-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--edge);border-radius:9px}
#content table{width:100%;border-collapse:collapse;font:normal .88rem/1.5 system-ui}
#content th,#content td{padding:9px 10px;border-bottom:1px solid var(--edge);text-align:left;vertical-align:top}
#content th{color:var(--gold);background:#25374a}
#content img{max-width:100%;height:auto}
@media(max-width:850px){.layout{display:block;padding:20px 15px 70px}aside{position:relative;top:auto;max-height:285px;margin-bottom:24px}#content{font-size:1.06em}}
@media(max-width:450px){body{font-size:17px}.top-inner{padding:9px 11px}.tools a,.tools button{padding:5px 8px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body><div class="top"><div class="top-inner"><a class="brand" href="index.html">The 54</a><div class="tools"><button type="button" id="minus" aria-label="Smaller text">A−</button><button type="button" id="plus" aria-label="Larger text">A+</button><a href="#top">Top ↑</a><a href="index.html">Home</a></div></div></div>
<div class="layout" id="top"><aside aria-label="Contents"><h2>One Atlas · Contents</h2><nav id="toc"></nav></aside><main><div id="status" role="status">Loading the complete One Atlas…</div><article id="content" aria-label="One Atlas"></article><noscript>JavaScript is needed for this reading view. <a href="THE_54_ONE_ATLAS.md">View the original atlas</a>.</noscript></main></div>
<script>
window.addEventListener('load',async()=>{
 const content=document.getElementById('content'),toc=document.getElementById('toc'),status=document.getElementById('status');let scale=1;
 const setScale=()=>content.style.fontSize=(1.13*scale)+'em';
 document.getElementById('plus').onclick=()=>{scale=Math.min(1.6,scale+.1);setScale()};
 document.getElementById('minus').onclick=()=>{scale=Math.max(.8,scale-.1);setScale()};
 try{
 const response=await fetch('THE_54_ONE_ATLAS.md',{cache:'no-cache'});
 if(!response.ok)throw Error('Source unavailable: HTTP '+response.status);
 if(!window.marked||!window.DOMPurify)throw Error('Reader libraries unavailable');
 const markdown=await response.text();
 content.innerHTML=DOMPurify.sanitize(marked.parse(markdown,{gfm:true}));
 const headings=[...content.querySelectorAll('h1,h2,h3')],used=new Set();let mainCells=0;
 const slug=s=>s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,88);
 for(let i=0;i<headings.length;i++){
  let h=headings[i],label=h.textContent.trim(),cell=label.match(/^(\d{1,2})\s+[—–-]\s+/);
  let id=h.tagName==='H3'&&cell&&mainCells<54?'cell-'+cell[1].padStart(2,'0'):(slug(label)||'section-'+i);
  if(id.startsWith('cell-'))mainCells++;
  let candidate=id,k=2;while(used.has(candidate))candidate=id+'-'+k++;
  h.id=candidate;used.add(candidate);
  if(h.tagName==='H2'||id.startsWith('cell-')||i===0){let a=document.createElement('a');a.href='#'+candidate;a.textContent=label;if(id.startsWith('cell-'))a.className='cell';toc.appendChild(a)}
 }
 content.querySelectorAll('table').forEach(t=>{const wrapper=document.createElement('div');wrapper.className='table-wrap';t.before(wrapper);wrapper.appendChild(t)});
 content.querySelectorAll('a[href^="#"]').forEach(a=>{
  const id=a.getAttribute('href').slice(1);
  if(/^cell-\d{2}$/.test(id)&&!document.getElementById(id))a.href='#top';
 });
 status.remove();setScale();
 if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target)target.scrollIntoView()}
 }catch(error){status.innerHTML='Unable to load the atlas in this reader. <a href="https://github.com/TitanicParker/fiche-ceathar/blob/main/THE_54_ONE_ATLAS.md">Read the source on GitHub</a>.';console.error(error)}
});
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script><script src="./readable-links.js" defer></script></body></html>
