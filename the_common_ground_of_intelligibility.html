<style>
:root{color-scheme:dark;--bg:#10151e;--paper:#192432;--ink:#f1f0e9;--muted:#b7c6d4;--gold:#edcf83;--mint:#83ded0;--edge:#35465b}

main{min-width:0}.intro{text-align:center;padding:24px 0 40px}.intro .kicker{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}.intro h1{font:normal clamp(2.3rem,6vw,4rem)/1.13 Georgia,serif;letter-spacing:-.025em;margin:16px auto 14px;max-width:680px}.intro p{font:italic 1.2rem Georgia,serif;color:#d5c9ac;margin:0}

@media(max-width:760px){.layout{display:block;padding:14px 17px 65px}aside{position:relative;top:auto;max-height:210px;margin-bottom:35px}.intro{padding:20px 0 30px}article{font-size:1.07em}.top-inner{padding:10px 12px}.brand{font-size:1rem}.tools{gap:5px}.tools a,.tools button{padding:7px 9px;font-size:.76rem}}

<script>
window.addEventListener('DOMContentLoaded',async()=>{
 const book=document.getElementById('book'),toc=document.getElementById('toc'),status=document.getElementById('status');
 let scale=1;const setScale=()=>{book.style.fontSize=(1.12*scale)+'em'};
 document.getElementById('smaller').addEventListener('click',()=>{scale=Math.max(.8,scale-.1);setScale()});
 document.getElementById('larger').addEventListener('click',()=>{scale=Math.min(1.6,scale+.1);setScale()});
 try{
  const response=await fetch('THE_COMMON_GROUND_OF_INTELLIGIBILITY.md',{cache:'no-cache'});
  if(!response.ok)throw Error('Manuscript unavailable ('+response.status+')');
  if(!window.marked||!window.DOMPurify)throw Error('Reader libraries unavailable');
  const markdown=await response.text();
  book.innerHTML=DOMPurify.sanitize(marked.parse(markdown,{gfm:true}));
  let count=0;
  book.querySelectorAll('h2').forEach(h=>{
   count++;const id='chapter-'+count;h.id=id;
   const link=document.createElement('a');link.href='#'+id;link.textContent=h.textContent;
   toc.appendChild(link);
  });
  status.remove();setScale();
  if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el)el.scrollIntoView()}
 }catch(e){status.innerHTML='Unable to load this HTML reading view. <a href="THE_COMMON_GROUND_OF_INTELLIGIBILITY.md">Read the original manuscript</a>.';console.error(e)}
});
</script>
